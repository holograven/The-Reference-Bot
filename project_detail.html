<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Detail — The Reference Bot</title>
    <script src="manifest.js"></script>
    <style>
        /* === Reset === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Courier New", Courier, monospace;
            background-color: #000;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* === Minimal Header === */
        header {
            text-align: center;
            padding: 22px 0;
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
        }

        header h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* Admin + button */
        .admin-plus {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.18);
            text-decoration: none;
            font-size: 18px;
            font-weight: 300;
            line-height: 1;
            padding: 4px 8px;
            transition: color 0.3s ease, opacity 0.3s ease;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        .admin-plus:hover {
            color: rgba(255,255,255,0.6);
        }

        /* === Floating back button === */
        .back-float {
            position: fixed;
            left: 30px;
            bottom: 30px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }

        .back-float::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            border-left: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(45deg) translateX(2px);
            opacity: 0.7;
            transition: opacity 0.25s ease;
        }

        .back-float:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }

        .back-float:hover::before {
            opacity: 1;
        }

        /* === Project title / last-edit label === */
        .project-title {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 18px 50px 12px;
            opacity: 0.5;
        }

        /* === Image stack === */
        .project-images {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 50px 60px;
        }

        .project-images img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 20px;
            background: #111;
            scroll-margin-top: 80px;
        }

        /* === Description block === */
        .project-description {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 50px 100px;
            border-top: 1px solid #333;
        }

        .project-description,
        .project-description * {
            color: #fff !important;
        }

        /* === Error / loading states === */
        .status-message {
            text-align: center;
            padding: 80px 40px;
            color: #666;
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        /* === Responsive === */
        @media (max-width: 768px) {
            header {
                padding: 16px 0;
            }
            header h1 {
                font-size: 16px;
                letter-spacing: 3px;
            }
            .admin-plus {
                right: 10px;
                font-size: 16px;
                padding: 2px 6px;
            }
            .back-float {
                left: 16px;
                bottom: 16px;
                width: 38px;
                height: 38px;
            }
            .back-float::before {
                width: 8px;
                height: 8px;
            }
            .project-title {
                padding: 30px 20px 15px;
                font-size: 11px;
            }
            .project-images {
                padding: 10px 20px 40px;
            }
            .project-images img {
                margin-bottom: 12px;
            }
            .project-description {
                padding: 20px 20px 60px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 14px 0;
            }
            header h1 {
                font-size: 14px;
                letter-spacing: 2px;
            }
            .back-float {
                left: 12px;
                bottom: 12px;
                width: 34px;
                height: 34px;
            }
            .project-title {
                padding: 24px 14px 12px;
                font-size: 10px;
                letter-spacing: 2px;
            }
            .project-images {
                padding: 6px 10px 30px;
            }
            .project-images img {
                margin-bottom: 8px;
            }
            .project-description {
                padding: 16px 14px 50px;
            }
            .status-message {
                padding: 50px 20px;
                font-size: 13px;
            }
        }

        /* ================================================================
           ADMIN SIDEBAR
           ================================================================ */
        .admin-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .admin-overlay.open { opacity: 1; pointer-events: auto; }

        .admin-sidebar {
            position: fixed; top: 0; right: 0; width: 360px; max-width: 92vw;
            height: 100vh; height: 100dvh; z-index: 2100;
            background: #0a0a0a; border-left: 1px solid rgba(255,255,255,0.08);
            transform: translateX(100%); transition: transform 0.3s ease;
            display: flex; flex-direction: column; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .admin-sidebar.open { transform: translateX(0); }

        .admin-sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky; top: 0; background: #0a0a0a; z-index: 2;
        }
        .admin-sidebar-header h2 {
            font-size: 14px; font-weight: 700; letter-spacing: 3px;
            font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; text-transform: uppercase;
        }
        .admin-sidebar-close {
            background: none; border: none; color: rgba(255,255,255,0.4);
            font-size: 20px; cursor: pointer; padding: 4px 8px; line-height: 1;
        }
        .admin-sidebar-close:hover { color: #fff; }

        .admin-body { flex:1; padding: 20px 18px; overflow-y: auto; }

        .admin-screen { display: none; }
        .admin-screen.active { display: block; }

        .admin-body label {
            display: block; font-size: 10px; text-transform: uppercase;
            letter-spacing: 2px; color: #888; margin: 14px 0 6px;
        }
        .admin-body label:first-child { margin-top: 0; }

        .admin-body input, .admin-body select {
            width: 100%; padding: 10px 12px; font-size: 15px;
            background: transparent; border: 1px solid rgba(255,255,255,0.12);
            color: #fff; font-family: inherit; outline: none; border-radius: 0;
            -webkit-appearance: none; transition: border-color 0.2s;
        }
        .admin-body input:focus, .admin-body select:focus {
            border-color: rgba(255,255,255,0.35);
        }
        .admin-body select { cursor: pointer; }
        .admin-body select option { background: #1a1a1a; color: #fff; }

        .admin-body .film-row { display: flex; gap: 6px; }
        .admin-body .film-row select { flex: 1; }

        .admin-btn {
            display: block; width: 100%; padding: 11px; margin-top: 16px;
            font-size: 12px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer;
            background: transparent; color: #fff;
            border: 1px solid rgba(255,255,255,0.2); font-family: inherit;
            transition: all 0.25s;
        }
        .admin-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }
        .admin-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .admin-btn.small { padding: 8px; font-size: 10px; letter-spacing: 1px; margin-top: 8px; }
        .admin-btn.danger { border-color: rgba(255,80,80,0.3); color: #ff5555; }

        .admin-body .msg {
            padding: 10px 12px; margin-top: 10px; font-size: 11px;
            border-left: 2px solid; display: none; letter-spacing: 0.5px;
        }
        .admin-body .msg.error { color:#ff5555; border-color:#ff5555; background:rgba(255,80,80,0.06); display:block; }
        .admin-body .msg.success { color:#4f4; border-color:#4f4; background:rgba(255,80,80,0.06); display:block; }

        .admin-body .info-box {
            padding: 10px 12px; margin-top: 12px; font-size: 10px; color: #888;
            border: 1px solid rgba(255,255,255,0.08); line-height: 1.7;
        }
        .admin-body .info-box a { color: #aaa; }

        .admin-body .preview-grid {
            display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 12px;
        }
        .admin-body .preview-item {
            position: relative; aspect-ratio: 1; overflow: hidden;
            background: #111; border: 1px solid rgba(255,255,255,0.06);
        }
        .admin-body .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .admin-body .preview-item .remove-btn {
            position: absolute; top: 3px; right: 3px;
            width: 20px; height: 20px; border-radius: 50%;
            background: rgba(0,0,0,0.7); color: #ff5555; border: none;
            font-size: 12px; cursor: pointer; line-height: 1;
            display: flex; align-items: center; justify-content: center;
        }

        .admin-body .progress-wrap { margin-top: 14px; display: none; }
        .admin-body .progress-bar {
            width: 100%; height: 3px; background: rgba(255,255,255,0.08); overflow: hidden;
        }
        .admin-body .progress-bar .fill {
            height: 100%; background: #fff; width: 0%; transition: width 0.3s;
        }
        .admin-body .progress-text { font-size: 10px; color: #888; margin-top: 4px; }
        .admin-body .upload-log {
            margin-top: 10px; max-height: 120px; overflow-y: auto;
            font-size: 10px; color: #666; line-height: 1.7;
        }
        .admin-body .upload-log .ok { color: #4f4; }
        .admin-body .upload-log .err { color: #f44; }

        @media (max-width: 480px) {
            .admin-sidebar { width: 100vw; max-width: 100vw; border-left: none; }
            .admin-overlay.open { opacity: 0; } /* sidebar fills screen, no overlay needed */
        }
    </style>
</head>
<body>

    <header>
        <h1>The Reference Bot</h1>
        <a href="admin.html" class="admin-plus" title="Admin" id="admin-toggle">+</a>
    </header>

    <a class="back-float" href="index.html" title="Back"></a>

    <div class="project-title" id="project-title">—</div>

    <div class="project-images" id="project-images"></div>

    <div class="project-description" id="project-description"></div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const projectName = params.get('project');

            if (!projectName) {
                document.getElementById('project-title').textContent = 'No project specified';
                document.getElementById('project-images').innerHTML =
                    '<div class="status-message">Use <code>?project=MOVIE_NAME</code> in the URL.</div>';
                return;
            }

            const manifest = window.__MANIFEST__;

            if (!manifest || !manifest.projects) {
                showError('Unable to load manifest.js — check the file exists.');
                return;
            }

            const project = manifest.projects[projectName];
            if (!project) {
                showError('Project "' + escapeHTML(projectName) + '" not found in manifest.js');
                return;
            }

            const encoded = encodeURIComponent(projectName);
            const folderUrl = 'reference/film/' + encoded + '/';
            const images = project.images || [];
            const hasDescription = project.hasDescription || false;
            const targetImg = parseInt(params.get('img'), 10);

            // Header → project name
            document.querySelector('header h1').textContent = projectName.toUpperCase();
            document.title = projectName + ' — The Reference Bot';

            // Top-left → last-edit time from manifest
            const titleEl = document.getElementById('project-title');
            titleEl.textContent = project.lastEdit ? 'Last edit: ' + project.lastEdit : 'Last edit: —';

            // Render images with lazy loading
            const imgContainer = document.getElementById('project-images');
            const fragment = document.createDocumentFragment();
            let targetEl = null;
            images.forEach((file, i) => {
                const img = document.createElement('img');
                img.id = 'img-' + i;
                img.src = folderUrl + encodeURIComponent(file);
                img.alt = file;
                img.decoding = 'async';
                // Target image: load eagerly so it has dimensions for scroll
                if (i === targetImg) {
                    img.loading = 'eager';
                    targetEl = img;
                } else {
                    img.loading = 'lazy';
                }
                fragment.appendChild(img);
            });
            imgContainer.appendChild(fragment);

            // Scroll to target image if specified
            if (targetEl) {
                const doScroll = () => {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                };
                if (targetEl.complete && targetEl.naturalHeight > 0) {
                    doScroll();
                } else {
                    targetEl.onload = doScroll;
                    // Fallback: if image fails or is cached and onload already fired
                    setTimeout(() => {
                        if (targetEl.naturalHeight > 0 || targetEl.complete) doScroll();
                    }, 300);
                }
            }

            // Load Description.txt if present
            if (hasDescription) {
                fetch(folderUrl + 'Description.txt')
                    .then(res => {
                        if (!res.ok) throw new Error('not found');
                        return res.text();
                    })
                    .then(txtHtml => {
                        const parser = new DOMParser();
                        const txtDoc = parser.parseFromString(txtHtml, 'text/html');

                        // Inject <style> blocks into <head>
                        txtDoc.querySelectorAll('style').forEach(styleEl => {
                            const s = document.createElement('style');
                            s.textContent = styleEl.textContent;
                            document.head.appendChild(s);
                        });

                        document.getElementById('project-description').innerHTML = txtDoc.body.innerHTML;
                    })
                    .catch(() => {
                        document.getElementById('project-description').innerHTML = '';
                    });
            } else {
                document.getElementById('project-description').innerHTML = '';
            }

            function showError(msg) {
                document.getElementById('project-title').textContent = 'Error';
                document.getElementById('project-images').innerHTML =
                    '<div class="status-message">' + escapeHTML(msg) + '</div>';
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
        })();
    </script>

    <!-- ================================================================
       ADMIN SIDEBAR
       ================================================================ -->
    <div class="admin-overlay" id="admin-overlay"></div>
    <div class="admin-sidebar" id="admin-sidebar">
        <div class="admin-sidebar-header">
            <h2>Upload</h2>
            <button class="admin-sidebar-close" id="admin-sidebar-close">&times;</button>
        </div>
        <div class="admin-body">

            <div class="admin-screen active" id="as-login">
                <label>Password</label>
                <input type="password" id="as-password" placeholder="Enter password" autocomplete="off">
                <div class="msg" id="as-login-msg"></div>
                <button class="admin-btn" id="as-login-btn">Unlock</button>
            </div>

            <div class="admin-screen" id="as-token">
                <label>GitHub Token</label>
                <input type="password" id="as-token-input" placeholder="ghp_xxxxxxxx" autocomplete="off">
                <div class="info-box">Create at <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> — scope: <b>repo</b></div>
                <div class="msg" id="as-token-msg"></div>
                <button class="admin-btn" id="as-token-save">Save Token</button>
            </div>

            <div class="admin-screen" id="as-upload">
                <label>Film</label>
                <div class="film-row">
                    <select id="as-film-select">
                        <option value="__new__">+ New Film...</option>
                    </select>
                </div>
                <input type="text" id="as-new-film-name" placeholder="Film name..." style="margin-top:8px;">

                <label>Images</label>
                <input type="file" id="as-image-input" accept="image/*" multiple style="display:none;">
                <button class="admin-btn small" id="as-pick-btn">Select Images</button>
                <div class="preview-grid" id="as-preview"></div>

                <div class="progress-wrap" id="as-progress-wrap">
                    <div class="progress-bar"><div class="fill" id="as-progress-fill"></div></div>
                    <div class="progress-text" id="as-progress-text"></div>
                    <div class="upload-log" id="as-upload-log"></div>
                </div>

                <div class="msg" id="as-main-msg"></div>
                <button class="admin-btn" id="as-upload-btn" disabled>Upload</button>

                <button class="admin-btn small danger" id="as-logout-btn" style="margin-top:30px;">Logout</button>
            </div>

        </div>
    </div>

    <script src="admin-sidebar.js"></script>
</body>
</html>
