<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Reference Bot</title>
    <script src="manifest.js"></script>
    <style>
        /* === Reset === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* === Minimal Header === */
        header {
            text-align: center;
            padding: 22px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        header h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* Admin + button */
        .admin-plus {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.45);
            text-decoration: none;
            font-size: 18px;
            font-weight: 300;
            line-height: 1;
            padding: 4px 8px;
            transition: color 0.3s ease, opacity 0.3s ease;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        .admin-plus:hover {
            color: rgba(255,255,255,0.85);
        }

        /* === Container offset for fixed header === */
        .container {
            width: 100%;
            padding-top: 85px;
        }

        /* === Section (movie block) === */
        .season-block {
            margin-bottom: 50px;
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: auto 14vh;
        }

        .season-block:hover .season-title {
            opacity: 0.5;
        }

        /* === Placeholder (before lazy build) === */
        .season-placeholder {
            min-height: 14vh;
            display: flex;
            align-items: flex-end;
            padding: 0 40px 15px;
            opacity: 0.35;
            transition: opacity 0.3s ease;
        }

        .season-placeholder .placeholder-text {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            color: #888;
        }

        /* === Title === */
        .season-title {
            font-size: 14px;
            text-transform: uppercase;
            padding: 0 40px 15px;
            letter-spacing: 2px;
            font-weight: bold;
            transition: opacity 0.2s ease;
        }

        /* === Marquee scroll strip === */
        .scroll-wrapper {
            width: 100%;
            height: 10vh;
            min-height: 60px;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .scroll-content {
            display: flex;
            height: 100%;
            white-space: nowrap;
            animation: marquee 45s linear infinite;
            will-change: transform;
        }

        .scroll-wrapper:hover .scroll-content {
            animation-play-state: paused;
        }

        /* === Image item wrapper (blur-up placeholder) === */
        .image-item-wrapper {
            height: 100%;
            width: auto;
            display: inline-block;
            position: relative;
            overflow: hidden;
            background: #111;
            flex-shrink: 0;
        }

        .image-item {
            height: 100%;
            width: auto;
            display: block;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.4s ease;
            filter: blur(8px);
        }

        .image-item.loaded {
            opacity: 1;
            filter: blur(0);
        }

        @keyframes marquee {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* === Empty state === */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: #666;
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        .empty-state code {
            color: #999;
            background: rgba(255,255,255,0.06);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 13px;
        }

        /* === Search bar === */
        .search-wrap {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 20px 20px 0;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .search-input:focus {
            border-color: rgba(255, 255, 255, 0.35);
            background: transparent;
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: none;
            border-radius: 0;
            max-height: 260px;
            overflow-y: auto;
            display: none;
            z-index: 500;
        }

        .search-dropdown.active {
            display: block;
        }

        .search-dropdown-item {
            padding: 10px 16px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .search-dropdown-item:hover,
        .search-dropdown-item.highlight {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .search-dropdown-item mark {
            background: transparent;
            color: #00FFFF;
            font-weight: bold;
        }

        /* === Responsive === */
        @media (max-width: 768px) {
            header {
                padding: 16px 0;
            }
            header h1 {
                font-size: 16px;
                letter-spacing: 3px;
            }
            .admin-plus {
                right: 10px;
                font-size: 16px;
                padding: 2px 6px;
            }
            .container {
                padding-top: 62px;
            }
            .search-wrap {
                max-width: 260px;
                padding: 14px 16px 0;
            }
            .search-input {
                font-size: 16px;       /* >=16px prevents iOS auto-zoom on focus */
                padding: 9px 12px;
            }
            .search-dropdown {
                left: 16px;
                right: 16px;
                max-height: 220px;
            }
            .search-dropdown-item {
                padding: 10px 14px;
                font-size: 13px;
            }
            .season-title {
                padding: 0 20px 10px;
                font-size: 12px;
            }
            .season-placeholder {
                padding: 0 20px 10px;
            }
            .season-block {
                margin-bottom: 35px;
            }
            .scroll-wrapper {
                height: 9vh;
                min-height: 50px;
            }
        }

        @media (max-width: 480px) {
            .search-wrap {
                max-width: 220px;
                padding: 10px 12px 0;
            }
            .search-input {
                font-size: 16px;
                padding: 8px 10px;
            }
            .search-dropdown {
                left: 12px;
                right: 12px;
                max-height: 180px;
            }
            .search-dropdown-item {
                padding: 9px 12px;
                font-size: 12px;
            }
            .season-title {
                padding: 0 12px 8px;
                font-size: 11px;
            }
            .season-placeholder {
                padding: 0 12px 8px;
            }
            .scroll-wrapper {
                height: 8vh;
                min-height: 44px;
            }
        }

        /* ================================================================
           ADMIN SIDEBAR
           ================================================================ */
        .admin-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .admin-overlay.open { opacity: 1; pointer-events: auto; }

        .admin-sidebar {
            position: fixed; top: 0; right: 0; width: 360px; max-width: 92vw;
            height: 100vh; height: 100dvh; z-index: 2100;
            background: #0a0a0a; border-left: 1px solid rgba(255,255,255,0.08);
            transform: translateX(100%); transition: transform 0.3s ease;
            display: flex; flex-direction: column; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .admin-sidebar.open { transform: translateX(0); }

        .admin-sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky; top: 0; background: #0a0a0a; z-index: 2;
        }
        .admin-sidebar-header h2 {
            font-size: 14px; font-weight: 700; letter-spacing: 3px;
            font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; text-transform: uppercase;
        }
        .admin-sidebar-close {
            background: none; border: none; color: rgba(255,255,255,0.4);
            font-size: 20px; cursor: pointer; padding: 4px 8px; line-height: 1;
        }
        .admin-sidebar-close:hover { color: #fff; }

        .admin-body { flex:1; padding: 20px 18px; overflow-y: auto; }

        /* Admin screens inside sidebar */
        .admin-screen { display: none; }
        .admin-screen.active { display: block; }

        .admin-body label {
            display: block; font-size: 10px; text-transform: uppercase;
            letter-spacing: 2px; color: #888; margin: 14px 0 6px;
        }
        .admin-body label:first-child { margin-top: 0; }

        .admin-body input, .admin-body select {
            width: 100%; padding: 10px 12px; font-size: 15px;
            background: transparent; border: 1px solid rgba(255,255,255,0.12);
            color: #fff; font-family: inherit; outline: none; border-radius: 0;
            -webkit-appearance: none; transition: border-color 0.2s;
        }
        .admin-body input:focus, .admin-body select:focus {
            border-color: rgba(255,255,255,0.35);
        }
        .admin-body select { cursor: pointer; }
        .admin-body select option { background: #1a1a1a; color: #fff; }

        .admin-body .film-row { display: flex; gap: 6px; }
        .admin-body .film-row select { flex: 1; }

        .admin-btn {
            display: block; width: 100%; padding: 11px; margin-top: 16px;
            font-size: 12px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer;
            background: transparent; color: #fff;
            border: 1px solid rgba(255,255,255,0.2); font-family: inherit;
            transition: all 0.25s;
        }
        .admin-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }
        .admin-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .admin-btn.small { padding: 8px; font-size: 10px; letter-spacing: 1px; margin-top: 8px; }
        .admin-btn.danger { border-color: rgba(255,80,80,0.3); color: #ff5555; }

        .admin-body .msg {
            padding: 10px 12px; margin-top: 10px; font-size: 11px;
            border-left: 2px solid; display: none; letter-spacing: 0.5px;
        }
        .admin-body .msg.error { color:#ff5555; border-color:#ff5555; background:rgba(255,80,80,0.06); display:block; }
        .admin-body .msg.success { color:#4f4; border-color:#4f4; background:rgba(255,80,80,0.06); display:block; }

        .admin-body .info-box {
            padding: 10px 12px; margin-top: 12px; font-size: 10px; color: #888;
            border: 1px solid rgba(255,255,255,0.08); line-height: 1.7;
        }
        .admin-body .info-box a { color: #aaa; }

        .admin-body .preview-grid {
            display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 12px;
        }
        .admin-body .preview-item {
            position: relative; aspect-ratio: 1; overflow: hidden;
            background: #111; border: 1px solid rgba(255,255,255,0.06);
        }
        .admin-body .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .admin-body .preview-item .remove-btn {
            position: absolute; top: 3px; right: 3px;
            width: 20px; height: 20px; border-radius: 50%;
            background: rgba(0,0,0,0.7); color: #ff5555; border: none;
            font-size: 12px; cursor: pointer; line-height: 1;
            display: flex; align-items: center; justify-content: center;
        }

        .admin-body .progress-wrap { margin-top: 14px; display: none; }
        .admin-body .progress-bar {
            width: 100%; height: 3px; background: rgba(255,255,255,0.08); overflow: hidden;
        }
        .admin-body .progress-bar .fill {
            height: 100%; background: #fff; width: 0%; transition: width 0.3s;
        }
        .admin-body .progress-text { font-size: 10px; color: #888; margin-top: 4px; }
        .admin-body .upload-log {
            margin-top: 10px; max-height: 120px; overflow-y: auto;
            font-size: 10px; color: #666; line-height: 1.7;
        }
        .admin-body .upload-log .ok { color: #4f4; }
        .admin-body .upload-log .err { color: #f44; }

        @media (max-width: 480px) {
            .admin-sidebar { width: 100vw; max-width: 100vw; border-left: none; }
            .admin-overlay.open { opacity: 0; } /* sidebar fills screen, no overlay needed */
        }
    </style>
</head>
<body>

    <header>
        <h1>The Reference Bot</h1>
        <a href="admin.html" class="admin-plus" title="Admin" id="admin-toggle">+</a>
    </header>

    <div class="container" id="project-container">

        <div class="search-wrap">
            <input class="search-input" id="search-input" type="text" placeholder="Search films..." autocomplete="off">
            <div class="search-dropdown" id="search-dropdown"></div>
        </div>

        <div id="sections-wrap"></div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('project-container');
            const sectionsWrap = document.getElementById('sections-wrap');
            const searchInput = document.getElementById('search-input');
            const searchDropdown = document.getElementById('search-dropdown');
            const manifest = window.__MANIFEST__;

            // Validate
            if (!manifest || !manifest.projects || Object.keys(manifest.projects).length === 0) {
                sectionsWrap.innerHTML = `
                    <div class="empty-state">
                        No films yet.<br><br>
                        Add subfolders to <code>reference/film/</code> and<br>
                        list them in <code>manifest.js</code> under <code>window.__MANIFEST__</code>.
                    </div>`;
                return;
            }

            const projects = manifest.projects;
            const names = Object.keys(projects);

            // Map: project name → current DOM element (placeholder or built section)
            const elMap = {};

            // =========================================================
            //  1. CREATE LIGHTWEIGHT PLACEHOLDERS (no images yet)
            // =========================================================
            const fragment = document.createDocumentFragment();
            const placeholders = [];

            names.forEach(name => {
                const placeholder = document.createElement('section');
                placeholder.className = 'season-placeholder';
                placeholder.dataset.project = name;
                placeholder.innerHTML = `<span class="placeholder-text">${escapeHTML(name)}</span>`;
                fragment.appendChild(placeholder);
                placeholders.push(placeholder);
                elMap[name] = placeholder;
            });

            sectionsWrap.appendChild(fragment);

            // =========================================================
            //  2. INTERSECTION OBSERVER — lazy-build sections
            // =========================================================
            const buildObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const placeholder = entry.target;
                        const projectName = placeholder.dataset.project;
                        if (!projectName) return;
                        const data = projects[projectName];
                        if (!data) return;

                        buildSection(placeholder, projectName, data);
                        buildObserver.unobserve(placeholder);
                    }
                });
            }, {
                rootMargin: '500px'
            });

            placeholders.forEach(p => buildObserver.observe(p));

            // =========================================================
            //  3. INTERSECTION OBSERVER — pause marquee when hidden
            // =========================================================
            const pauseObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const content = entry.target.querySelector('.scroll-content');
                    if (!content) return;
                    content.style.animationPlayState = entry.isIntersecting ? 'running' : 'paused';
                });
            });

            // =========================================================
            //  4. BUILD A FULL SECTION (replaces placeholder)
            // =========================================================
            function buildSection(placeholder, projectName, data) {
                const images = data.images || [];
                if (images.length === 0) {
                    placeholder.remove();
                    return;
                }

                const encoded = encodeURIComponent(projectName);
                const basePath = 'reference/film/' + encoded + '/';

                const section = document.createElement('section');
                section.className = 'season-block';
                // Click anywhere on the section → navigate (images have stopPropagation)
                section.onclick = () => {
                    location.href = 'project_detail.html?project=' + encoded;
                };

                // Title
                const title = document.createElement('div');
                title.className = 'season-title';
                title.textContent = projectName;
                section.appendChild(title);

                // Scroll wrapper
                const wrapper = document.createElement('div');
                wrapper.className = 'scroll-wrapper';

                const content = document.createElement('div');
                content.className = 'scroll-content';

                // Duplicate images for seamless infinite scroll
                // Each image click carries the original index (before duplication)
                const total = images.length;
                const allImages = [...images, ...images];
                allImages.forEach((file, i) => {
                    const origIndex = i % total;

                    // Wrapper serves as lightweight placeholder
                    const wrapper = document.createElement('span');
                    wrapper.className = 'image-item-wrapper';

                    const img = document.createElement('img');
                    img.className = 'image-item';
                    img.src = basePath + encodeURIComponent(file);
                    img.alt = file;
                    img.loading = 'lazy';
                    img.decoding = 'async';

                    // Fade in when loaded (handles cached images too)
                    if (img.complete && img.naturalWidth > 0) {
                        img.classList.add('loaded');
                    } else {
                        img.onload = () => img.classList.add('loaded');
                        img.onerror = () => { img.style.display = 'none'; };
                    }

                    img.onclick = (e) => {
                        e.stopPropagation();
                        location.href = 'project_detail.html?project=' + encoded + '&img=' + origIndex;
                    };

                    wrapper.appendChild(img);
                    content.appendChild(wrapper);
                });

                wrapper.appendChild(content);
                section.appendChild(wrapper);

                // Replace placeholder with real section
                placeholder.replaceWith(section);
                elMap[projectName] = section;

                // Observe for pause/resume
                pauseObserver.observe(section);
            }

            // =========================================================
            //  5. SEARCH LOGIC
            // =========================================================
            let highlightedIdx = -1;

            searchInput.addEventListener('input', function() {
                const query = this.value.trim().toLowerCase();
                highlightedIdx = -1;
                searchDropdown.innerHTML = '';

                if (query.length === 0) {
                    searchDropdown.classList.remove('active');
                    return;
                }

                const matches = names.filter(n => n.toLowerCase().includes(query));
                if (matches.length === 0) {
                    searchDropdown.classList.remove('active');
                    return;
                }

                matches.forEach(name => {
                    const item = document.createElement('div');
                    item.className = 'search-dropdown-item';
                    // Highlight matching portion
                    const idx = name.toLowerCase().indexOf(query);
                    item.innerHTML =
                        escapeHTML(name.slice(0, idx)) +
                        '<mark>' + escapeHTML(name.slice(idx, idx + query.length)) + '</mark>' +
                        escapeHTML(name.slice(idx + query.length));
                    item.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        scrollToProject(name);
                    });
                    searchDropdown.appendChild(item);
                });

                searchDropdown.classList.add('active');
            });

            // Keyboard navigation
            searchInput.addEventListener('keydown', function(e) {
                const items = searchDropdown.querySelectorAll('.search-dropdown-item');
                if (items.length === 0) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    highlightedIdx = Math.min(highlightedIdx + 1, items.length - 1);
                    updateHighlight(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    highlightedIdx = Math.max(highlightedIdx - 1, 0);
                    updateHighlight(items);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (highlightedIdx >= 0 && items[highlightedIdx]) {
                        items[highlightedIdx].click();
                    } else if (items.length === 1) {
                        items[0].click();
                    }
                } else if (e.key === 'Escape') {
                    searchDropdown.classList.remove('active');
                    searchInput.blur();
                }
            });

            function updateHighlight(items) {
                items.forEach((item, i) => {
                    item.classList.toggle('highlight', i === highlightedIdx);
                });
            }

            // Hide dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
                    searchDropdown.classList.remove('active');
                }
            });

            // Scroll to a project — force-build if still a placeholder
            function scrollToProject(name) {
                searchDropdown.classList.remove('active');
                searchInput.value = name;
                searchInput.blur();

                let el = elMap[name];
                if (!el) return;

                // If still a placeholder, force-build it
                if (el.classList.contains('season-placeholder')) {
                    const data = projects[name];
                    if (!data) return;
                    buildObserver.unobserve(el);
                    buildSection(el, name, data);
                    el = elMap[name];
                    if (!el) return;
                }

                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // =========================================================
            //  UTILITY
            // =========================================================
            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
        })();
    </script>

    <!-- ================================================================
       ADMIN SIDEBAR
       ================================================================ -->
    <div class="admin-overlay" id="admin-overlay"></div>
    <div class="admin-sidebar" id="admin-sidebar">
        <div class="admin-sidebar-header">
            <h2>Upload</h2>
            <button class="admin-sidebar-close" id="admin-sidebar-close">&times;</button>
        </div>
        <div class="admin-body">

            <!-- Screen: Login -->
            <div class="admin-screen active" id="as-login">
                <label>Password</label>
                <input type="password" id="as-password" placeholder="Enter password" autocomplete="off">
                <div class="msg" id="as-login-msg"></div>
                <button class="admin-btn" id="as-login-btn">Unlock</button>
            </div>

            <!-- Screen: Token Setup -->
            <div class="admin-screen" id="as-token">
                <label>GitHub Token</label>
                <input type="password" id="as-token-input" placeholder="ghp_xxxxxxxx" autocomplete="off">
                <div class="info-box">Create at <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> — scope: <b>repo</b></div>
                <div class="msg" id="as-token-msg"></div>
                <button class="admin-btn" id="as-token-save">Save Token</button>
            </div>

            <!-- Screen: Upload -->
            <div class="admin-screen" id="as-upload">
                <label>Film</label>
                <div class="film-row">
                    <select id="as-film-select">
                        <option value="__new__">+ New Film...</option>
                    </select>
                </div>
                <input type="text" id="as-new-film-name" placeholder="Film name..." style="margin-top:8px;">

                <label>Images</label>
                <input type="file" id="as-image-input" accept="image/*" multiple style="display:none;">
                <button class="admin-btn small" id="as-pick-btn">Select Images</button>
                <div class="preview-grid" id="as-preview"></div>

                <div class="progress-wrap" id="as-progress-wrap">
                    <div class="progress-bar"><div class="fill" id="as-progress-fill"></div></div>
                    <div class="progress-text" id="as-progress-text"></div>
                    <div class="upload-log" id="as-upload-log"></div>
                </div>

                <div class="msg" id="as-main-msg"></div>
                <button class="admin-btn" id="as-upload-btn" disabled>Upload</button>

                <button class="admin-btn small danger" id="as-logout-btn" style="margin-top:30px;">Logout</button>
            </div>
